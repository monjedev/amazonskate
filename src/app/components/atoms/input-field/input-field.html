<div class="field" [class.has-error]="error()">
  @if (label()) {
    <label class="field__label">{{ label() }}</label>
  }
  <div class="input-container">
    <input
      [type]="type()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="input"
    />
  </div>
  @if (error()) {
    <small class="field__error">{{ error() }}</small>
  }
</div>
