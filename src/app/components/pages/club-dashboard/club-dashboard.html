<div class="dashboard">
  <header class="header">
    <div>
      <h1>{{ header.title }}</h1>
      <p>{{ header.subtitle }}</p>
    </div>
  </header>

  <div class="stats-grid">
    @for (kpi of kpis; track kpi.label) {
      <app-stat-card [kpi]="kpi" />
    }
  </div>

  <div class="tabs">
    @for (tab of tabs; track tab.id) {
      <button
        class="tab-btn"
        [class.active]="activeTab() === tab.label"
        (click)="setTab(tab.label)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div class="panel">
    <h3>Gestión de Atletas</h3>
    <p>Lista de atletas del club y sus perfiles</p>
    <app-data-table [columns] = "columns" [data] = "athletes" />
  </div>
</div>
