<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        @for (col of columns(); track col.key) {
          <th>{{ col.header }}</th>
        }
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (row of data(); track $index) {
        <tr>
          @for (col of columns(); track col.key) {
            <td>{{ row[col.key] }}</td>
          }
          <td>
            <button (click)="onAction(row)">Ver</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
