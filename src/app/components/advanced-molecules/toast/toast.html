@if (isVisible()) {
  <div class="toast" [class]="'toast--' + type()">
    <span class="toast-icon">
      @switch (type()) {
        @case ('success') {
          ✅
        }
        @case ('error') {
          ❌
        }
        @case ('warning') {
          ⚠️
        }
        @default {
          ℹ️
        }
      }
    </span>
    <div class="toast-content">
      <span class="toast-title">{{ title() }}</span>
      <span class="toast-message">{{ message() }}</span>
    </div>
    <button class="toast-close" (click)="close()">✕</button>
  </div>
}
