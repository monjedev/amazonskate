<div class="dropdown">
  <button class="dropdown-trigger" (click)="isOpen.set(!isOpen())">
    <ng-content select="[trigger]" />
  </button>

  @if (isOpen()) {
    <div class="dropdown-menu">
      @for (item of items(); track $index) {
        <button class="dropdown-item" (click)="select(item)">
          {{ item.label }}
        </button>
      }
    </div>
  }
</div>
